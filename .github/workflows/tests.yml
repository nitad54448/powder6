name: tests
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # no install step: the app has no dependencies. The browser pages need Chrome with WebGPU and are run locally.
      - run: node --test tests/regressions.test.cjs tests/cf-adaptive.test.cjs tests/cf-startup.test.cjs tests/numerics.test.cjs tests/project-unpack.test.cjs
