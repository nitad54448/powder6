name: tests
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No install step: the app has no dependencies.
      - run: node --test tests/*.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        page: [ui-consistency, ui-interactions, file-readers, pattern-only, project-save, project-symmetry, rc-boundaries, solve-fixes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Hosted Ubuntu runners include Chrome. These suites do not require GPU fitting.
      - run: node tests/run-webgpu.cjs "$(command -v google-chrome)" tests/${{ matrix.page }}.html
